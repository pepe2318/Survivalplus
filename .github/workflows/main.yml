name: Build SurvivalPlus

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extraer código fuente
        run: unzip -o SurvivalPlus-source-alpha.zip -d .

      - name: Compilar mod
        run: gradle -p SurvivalPlus build
