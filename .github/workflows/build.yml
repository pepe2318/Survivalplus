name: Build SurvivalPlus

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extraer código fuente
        run: unzip -o SurvivalPlus-source-alpha.zip -d .

      - name: Buscar proyecto Gradle y compilar
        run: |
          PROJECT_DIR=$(find . -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró settings.gradle en el ZIP"
            exit 1
          fi
          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          gradle -p "$PROJECT_DIR" build

      - name: Guardar archivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalPlus
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
